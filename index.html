<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integer Operation Visualization</title>
    <style>
        body { text-align: center; font-family: Arial, sans-serif; }
        canvas { border: 1px solid black; margin-top: 10px; }
        input, select, button { margin: 20px; }
        .circle-button {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            font-size: 24px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin: 5px;
        }
        .blue-button { background-color: #1E90FF; }
        .pink-button { background-color: #FF1493; }
        .reset-button {
            background-color: rgb(125, 219, 11);
            color: rgb(16, 16, 16);
            padding: 10px 20px;
            font-size: 20px;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            border-radius: 20%;
        }
        body{
            background-image: url(https://img.freepik.com/free-photo/top-view-geometric-forms-with-copy-space_23-2148830232.jpg?t=st=1744633283~exp=1744636883~hmac=9449e7f9aac8ef6cca71d92e9101a3fe78570a206debca4dfb42079e0aa3a573&w=1380);
        }
    </style>
</head>
<body>
    <h2>การบวกลบจำนวนเต็ม</h2>
    <button class="circle-button blue-button" onclick="drawCircles(1, 1)">+1</button>
    <button class="circle-button pink-button" onclick="drawCircles(1, -1)">-1</button>
    <br>
    <button class="circle-button blue-button" onclick="drawCircles(2, 1)">+1</button>
    <button class="circle-button pink-button" onclick="drawCircles(2, -1)">-1</button>
    <br>
    <select id="operation">
        <option value="+">Addition (+)</option>
        <option value="-">Subtraction (-)</option>
    </select>
    <button onclick="calculateResult()">Compute</button>
    <button class="reset-button" onclick="resetCanvas()">Reset</button>
    <br>
    <canvas id="canvas" width="600" height="400"></canvas>

    <script>
        let storedNumbers = { num1: 0, num2: 0 };
        let circles = [];
        const radius = 25;
        const spacing = 70;
        let clickedCircles = [];

        function drawCircles(step, value) {
            if (step === 1) storedNumbers.num1 += value;
            if (step === 2) storedNumbers.num2 += value;

            updateCirclesArray();
            renderCircles();
        }

        function updateCirclesArray() {
            circles = [];
            let xOffset = 100;
            let total1 = storedNumbers.num1;
            let total2 = storedNumbers.num2;

            for (let i = 0; i < Math.abs(total1); i++) {
                circles.push({
                    x: xOffset + i * spacing,
                    y: 100,
                    value: total1 > 0 ? 1 : -1,
                    visible: true,
                    selected: false,
                    crossedOut: false
                });
            }
            for (let i = 0; i < Math.abs(total2); i++) {
                circles.push({
                    x: xOffset + i * spacing,
                    y: 200,
                    value: total2 > 0 ? 1 : -1,
                    visible: true,
                    selected: false,
                    crossedOut: false
                });
            }
        }

        function renderCircles() {
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            circles.forEach((circle) => {
                if (!circle.visible) return;

                ctx.beginPath();
                ctx.arc(circle.x, circle.y, radius, 0, Math.PI * 2);
                ctx.fillStyle = circle.value > 0 ? "#1E90FF" : "#FF1493";
                ctx.fill();
                ctx.strokeStyle = circle.selected ? "yellow" : "black";
                ctx.stroke();

                // ขีดกากบาทเมื่อถูก cross
                if (circle.crossedOut) {
                    ctx.strokeStyle = "black";
                    ctx.beginPath();
                    ctx.moveTo(circle.x - radius, circle.y - radius);
                    ctx.lineTo(circle.x + radius, circle.y + radius);
                    ctx.moveTo(circle.x + radius, circle.y - radius);
                    ctx.lineTo(circle.x - radius, circle.y + radius);
                    ctx.stroke();
                } else {
                    ctx.fillStyle = "white";
                    ctx.font = "14px Arial";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText(circle.value > 0 ? "+1" : "-1", circle.x, circle.y);
                }
            });
        }

        function calculateResult() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const operation = document.getElementById('operation').value;

            let actualNum1 = 0;
            let actualNum2 = 0;

            circles.forEach(c => {
                if (!c.visible || c.crossedOut) return;
                if (c.y === 100) actualNum1 += c.value;
                if (c.y === 200) actualNum2 += c.value;
            });

            let result = operation === "+" ? actualNum1 + actualNum2 : actualNum1 - actualNum2;

            ctx.clearRect(0, canvas.height - 30, canvas.width, 30);
            ctx.fillStyle = "black";
            ctx.font = "30px Arial";

            if (operation === "+") {
                ctx.fillText(`(${actualNum1}) + (${actualNum2}) = ${result}`, 100, canvas.height - 40);
            } else {
                ctx.fillText(`ผลลัพธ์ ${result}`, 100, canvas.height - 40);
            }
        }

        function resetCanvas() {
            storedNumbers.num1 = 0;
            storedNumbers.num2 = 0;
            circles = [];
            clickedCircles = [];
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        document.getElementById("canvas").addEventListener("click", function (e) {
            const rect = this.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            for (let i = 0; i < circles.length; i++) {
                const c = circles[i];
                if (!c.visible) continue;
                const dx = c.x - mouseX;
                const dy = c.y - mouseY;
                if (Math.sqrt(dx * dx + dy * dy) < radius) {
                    const operation = document.getElementById('operation').value;

                    if (operation === "+") {
                        c.selected = !c.selected;
                        if (c.selected) {
                            clickedCircles.push(i);
                        } else {
                            clickedCircles = clickedCircles.filter(index => index !== i);
                        }

                        if (clickedCircles.length === 2) {
                            const a = circles[clickedCircles[0]];
                            const b = circles[clickedCircles[1]];

                            if ((a.value === 1 && b.value === -1) || (a.value === -1 && b.value === 1)) {
                                a.visible = false;
                                b.visible = false;
                            }

                            a.selected = false;
                            b.selected = false;
                            clickedCircles = [];
                        }
                    } else if (operation === "-") {
                        c.crossedOut = !c.crossedOut;
                    }
                    break;
                }
            }

            renderCircles();
        });
    </script>
</body>
</html>
